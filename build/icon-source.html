<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /><title>icon</title>
<style>body{margin:0;background:#ddd}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
const SIZE = 1024;

let seed = 7;
function rnd() {
  seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0;
  return seed / 4294967296;
}
function jitter(a) { return (rnd() - 0.5) * a; }

function roughSeg(x1, y1, x2, y2, width, color, passes) {
  for (let p = 0; p < passes; p++) {
    const j = 6;
    ctx.beginPath();
    ctx.moveTo(x1 + jitter(j), y1 + jitter(j));
    ctx.quadraticCurveTo((x1 + x2) / 2 + jitter(j * 1.3), (y1 + y2) / 2 + jitter(j * 1.3), x2 + jitter(j), y2 + jitter(j));
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
}
function roughStroke(x1, y1, x2, y2, width, color) {
  roughSeg(x1, y1, x2, y2, width + 18, 'rgba(255,255,255,0.95)', 1);
  roughSeg(x1, y1, x2, y2, width, color, 2);
}

const INK = '#14181a';
const HALO = 'rgba(255,255,255,0.95)';
const PAPER = '#f6f1e6';

// --- background: soft rounded square, paper tone ---
function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
roundedRect(0, 0, SIZE, SIZE, 200);
const bgGrad = ctx.createLinearGradient(0, 0, 0, SIZE);
bgGrad.addColorStop(0, '#fbf7ec');
bgGrad.addColorStop(1, '#efe6d2');
ctx.fillStyle = bgGrad;
ctx.fill();

// pitch dots, subtle
ctx.save();
roundedRect(0, 0, SIZE, SIZE, 200);
ctx.clip();
ctx.fillStyle = 'rgba(20,24,26,0.07)';
for (let x = 60; x < SIZE; x += 76) {
  for (let y = 60; y < SIZE; y += 76) {
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}
// ground line
roughSeg(60, 830, 964, 830, 10, 'rgba(20,24,26,0.28)', 1);
ctx.restore();

// --- big-head portrait: head + short body stub + kicking foot only ---
// (full running legs vanish below ~64px, so keep only bold, large shapes)
ctx.save();
ctx.translate(400, 560);

// short body stub (anchors the head, reads as a body without thin limbs)
roughStroke(0, 40, 0, 220, 46, INK);
// one bold kicking leg toward the ball, thick and short
roughStroke(0, 200, 220, 130, 40, INK);

// head (huge, bold, jittered double-stroke)
const hx = 10, hy = -190, hr = 235;
ctx.beginPath();
ctx.arc(hx, hy, hr + 20, 0, Math.PI * 2);
ctx.fillStyle = HALO;
ctx.fill();
for (let i = 0; i < 3; i++) {
  ctx.beginPath();
  ctx.arc(hx + jitter(6), hy + jitter(6), hr, 0, Math.PI * 2);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 30;
  ctx.stroke();
}
// face
ctx.fillStyle = INK;
for (const ex of [hx + hr * 0.12, hx + hr * 0.58]) {
  ctx.beginPath();
  ctx.arc(ex, hy - hr * 0.08, 22, 0, Math.PI * 2);
  ctx.fill();
}
roughSeg(hx + hr * 0.08, hy + hr * 0.48, hx + hr * 0.62, hy + hr * 0.44, 20, INK, 1);

ctx.restore();

// --- ink-blot ball, mid-flight upper right ---
function drawBall(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  const steps = 26;
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const angle = (i / steps) * Math.PI * 2;
    const rr = r + jitter(r * 0.1);
    pts.push([Math.cos(angle) * rr, Math.sin(angle) * rr]);
  }
  ctx.beginPath();
  ctx.moveTo((pts[0][0] + pts[steps - 1][0]) / 2, (pts[0][1] + pts[steps - 1][1]) / 2);
  for (let i = 0; i < steps; i++) {
    const next = pts[(i + 1) % steps];
    const mid = [(pts[i][0] + next[0]) / 2, (pts[i][1] + next[1]) / 2];
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mid[0], mid[1]);
  }
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.lineWidth = 12;
  ctx.strokeStyle = HALO;
  ctx.stroke();
  ctx.fillStyle = HALO;
  ctx.rotate(0.5);
  for (const angle of [0, (Math.PI * 2) / 3, (Math.PI * 4) / 3]) {
    ctx.beginPath();
    ctx.arc(Math.cos(angle) * r * 0.42, Math.sin(angle) * r * 0.42, r * 0.09, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
drawBall(770, 610, 160);

window.__done = true;
</script>
</body>
</html>
