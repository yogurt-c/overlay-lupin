<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Overlay Lupin</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
    font-family: 'Menlo', 'Consolas', monospace;
  }

  #field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #idle-icon {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    border: 2.4px solid #14181a;
    cursor: pointer;
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  #idle-icon svg { width: 16px; height: 16px; }

  #status-dot {
    position: absolute;
    right: 8px;
    top: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8a9089;
    border: 1.4px solid rgba(255, 255, 255, 0.8);
  }
  #status-dot[data-state="found"] { background: #2f6b4f; }

  #quit-btn {
    position: absolute;
    left: 8px;
    top: 8px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    -webkit-app-region: no-drag;
    opacity: 0.32;
    transition: opacity 150ms ease;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #quit-btn:hover { opacity: 1; }
  #quit-btn svg { width: 9px; height: 9px; }

  #settings-btn {
    position: absolute;
    left: 26px;
    top: 8px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    -webkit-app-region: no-drag;
    opacity: 0.32;
    transition: opacity 150ms ease;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #settings-btn:hover { opacity: 1; }
  #settings-btn svg { width: 12px; height: 12px; }

  #settings-panel {
    position: absolute;
    left: 8px;
    top: 28px;
    width: 176px;
    max-width: calc(100vw - 38px);
    max-height: calc(100vh - 58px);
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.94);
    border: 1.3px solid rgba(20, 24, 26, 0.45);
    border-radius: 10px;
    box-shadow: 0 12px 26px -14px rgba(20, 24, 26, 0.5);
    padding: 10px;
    font-size: 11px;
    color: #14181a;
    -webkit-app-region: no-drag;
  }
  #settings-panel[hidden] { display: none; }
  .analytics-setting { border-top: 1px solid #ddd; margin-top: 8px; padding-top: 8px; }
  .analytics-setting label { display: flex; align-items: center; gap: 4px; }
  .analytics-setting p { font-size: 10px; line-height: 1.5; color: #667069; margin: 5px 0 0; }
  #analytics-msg:empty { display: none; }
  #settings-panel h2 {
    margin: 0 0 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .nickname-row { display: flex; gap: 4px; margin: 0; }
  .nickname-row input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 10.5px;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1.3px solid rgba(20, 24, 26, 0.35);
    background: #fff;
    color: #14181a;
  }
  .nickname-row input:focus { outline: none; border-color: #2f6b4f; }
  .nickname-row button {
    flex: none;
    font-family: inherit;
    font-size: 10.5px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1.3px solid rgba(20, 24, 26, 0.35);
    background: rgba(20, 24, 26, 0.04);
    cursor: pointer;
    color: #14181a;
  }
  .nickname-row :disabled { opacity: 0.45; cursor: default; }
  #nickname-msg { margin: 4px 0 8px; font-size: 9.5px; line-height: 1.4; color: #7a827c; min-height: 1.2em; }
  #nickname-msg.error { color: #9a4a3f; }
  .shortcut-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin: 0 0 6px;
  }
  .shortcut-row span { color: #7a827c; }
  .shortcut-row button {
    flex: none;
    min-width: 84px;
    font-family: inherit;
    font-size: 10.5px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1.3px solid rgba(20, 24, 26, 0.35);
    background: rgba(20, 24, 26, 0.04);
    cursor: pointer;
    color: #14181a;
  }
  .shortcut-row button.recording { background: #2f6b4f; border-color: #2f6b4f; color: #fff; }
  #settings-reset-btn {
    display: block;
    margin: 8px 0 0;
    padding: 0;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 10.5px;
    color: #7a827c;
    cursor: pointer;
  }
  #settings-reset-btn:hover { color: #14181a; }
  #settings-msg {
    margin: 6px 0 0;
    font-size: 9.5px;
    line-height: 1.4;
    color: #9a4a3f;
    min-height: 1.2em;
  }

  #leave-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    -webkit-app-region: no-drag;
    opacity: 0.3;
    transition: opacity 150ms ease, background 150ms ease;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #leave-btn:hover { opacity: 1; background: rgba(255, 255, 255, 0.92); }
  #leave-btn[hidden] { display: none; }
  #leave-btn svg { width: 14px; height: 14px; }
  #leave-btn.armed { opacity: 1; background: rgba(196, 74, 58, 0.92); }
  #leave-btn.armed svg { stroke: #fff; }

  #panel {
    position: absolute;
    right: 10px;
    bottom: 44px;
    width: 168px;
    background: rgba(255, 255, 255, 0.94);
    border: 1.3px solid rgba(20, 24, 26, 0.45);
    border-radius: 10px;
    box-shadow: 0 12px 26px -14px rgba(20, 24, 26, 0.5);
    padding: 8px;
    font-size: 11px;
    color: #14181a;
    -webkit-app-region: no-drag;
  }
  #panel[hidden] { display: none; }
  #panel h2 {
    margin: 0 0 6px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #game-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; margin: 0 0 6px; }
  #game-tabs button {
    flex: 1;
    font-family: inherit;
    font-size: 10.5px;
    padding: 4px 0;
    border-radius: 6px;
    border: 1.3px solid rgba(20, 24, 26, 0.35);
    background: rgba(20, 24, 26, 0.04);
    cursor: pointer;
    color: #14181a;
  }
  #game-tabs button.active { background: #2f6b4f; border-color: #2f6b4f; color: #fff; }
  #game-tabs button:disabled { opacity: 0.4; cursor: default; }

  #mode-choice[hidden], #match-view[hidden] { display: none; }
  #mode-choice .btn-row { margin: 0; }
  #variant-choice { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; }
  .choice-label { margin: 0; flex-shrink: 0; font-size: 9px; letter-spacing: 0.4px; color: #7a827c; }
  #variant-buttons { flex: 1; }
  #variant-buttons button { font-size: 10.5px; padding: 3px 0; border-radius: 999px; }
  #variant-buttons button.active { background: #14181a; border-color: #14181a; color: #fff; }
  #mode-choice button[disabled] { opacity: 0.35; cursor: default; }

  #mode-back-btn {
    display: block;
    margin: 0 0 8px;
    padding: 0;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 10.5px;
    color: #7a827c;
    cursor: pointer;
  }
  #mode-back-btn:hover { color: #14181a; }

  #peer-list, #room-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #peer-list[hidden], #room-list[hidden] { display: none; }
  #peer-list li, #room-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 5px 6px;
    border-radius: 6px;
    cursor: pointer;
  }
  #peer-list li:hover, #room-list li:hover { background: rgba(47, 107, 79, 0.12); }
  #peer-list li.pending { outline: 1.4px dashed #2f6b4f; outline-offset: -1px; }
  #peer-list .empty, #room-list .empty { color: #7a827c; padding: 4px 2px; }
  #room-list li.create { color: #2f6b4f; font-weight: 600; }
  #room-list li .count { color: #7a827c; font-variant-numeric: tabular-nums; }

  #waiting-box, #incoming-box, #lobby-box {
    position: absolute;
    right: 10px;
    bottom: 44px;
    width: 168px;
    background: rgba(255, 255, 255, 0.94);
    border: 1.3px solid rgba(20, 24, 26, 0.45);
    border-radius: 10px;
    box-shadow: 0 12px 26px -14px rgba(20, 24, 26, 0.5);
    padding: 12px;
    font-size: 11px;
    color: #14181a;
    -webkit-app-region: no-drag;
  }
  #waiting-box[hidden], #incoming-box[hidden], #lobby-box[hidden] { display: none; }
  #waiting-box p, #incoming-box p { margin: 0 0 10px; line-height: 1.4; }
  #waiting-box p strong, #incoming-box p strong { display: block; margin-bottom: 2px; }

  #lobby-box h2 {
    margin: 0 0 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #lobby-members { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #lobby-members li { display: flex; align-items: center; justify-content: space-between; padding: 3px 2px; }
  #lobby-members li[data-host] { color: #2f6b4f; }
  #lobby-members .tag { font-size: 9.5px; color: #2f6b4f; }
  #lobby-wait { color: #7a827c; padding: 6px 0 0; text-align: center; }
  #lobby-wait[hidden] { display: none; }
  #lobby-start-btn[hidden] { display: none; }

  .btn-row { display: flex; gap: 6px; }
  .btn-row button {
    flex: 1;
    font-family: inherit;
    font-size: 11px;
    padding: 5px 0;
    border-radius: 6px;
    border: 1.3px solid rgba(20, 24, 26, 0.35);
    background: rgba(20, 24, 26, 0.04);
    cursor: pointer;
  }
  .btn-row button.primary { background: #2f6b4f; border-color: #2f6b4f; color: #fff; }
  .btn-row button.danger { color: #9a4a3f; }

  #hud {
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    max-width: min(92vw, 480px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: #14181a;
    opacity: 0.55;
    text-shadow: 0 0 3px rgba(255, 255, 255, 0.85), 0 0 3px rgba(255, 255, 255, 0.85);
    font-variant-numeric: tabular-nums;
    transition: opacity 150ms ease;
  }
  #hud:hover { opacity: 1; }
  #hud[hidden] { display: none; }

  #banner {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.04em;
    color: #14181a;
    opacity: 0.72;
    pointer-events: none;
    text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 10px #fff;
    animation: banner-pop 220ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  #banner[hidden] { display: none; }
  #banner[data-kind="kickoff"] { font-size: 36px; opacity: 0.45; }
  #banner[data-kind="over"] { font-size: 22px; opacity: 0.85; }
  #banner[data-kind="small"] {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0;
    opacity: 0.85;
    max-width: min(90vw, 320px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @keyframes banner-pop {
    from { transform: translate(-50%, -50%) scale(0.82); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); }
  }

  #hint {
    margin: 6px 0 0;
    padding: 6px 4px 0 0;
    border-top: 1px solid rgba(20, 24, 26, 0.12);
    font-size: 9.5px;
    line-height: 1.5;
    color: #7a827c;
    white-space: pre-line;
    max-height: 44px;
    overflow-y: auto;
  }
  #hint::-webkit-scrollbar { width: 4px; }
  #hint::-webkit-scrollbar-thumb { background: rgba(20, 24, 26, 0.25); border-radius: 999px; }
  #hint::-webkit-scrollbar-track { background: transparent; }

  #reconnect-msg {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    font-size: 10.5px;
    color: #14181a;
    background: rgba(255, 255, 255, 0.85);
    padding: 4px 9px;
    border-radius: 999px;
  }
  #reconnect-msg[hidden] { display: none; }

  #update-notice {
    position: absolute;
    left: 8px;
    bottom: 10px;
    max-width: calc(100vw - 54px);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 4px 4px 9px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    border: 1.3px solid rgba(20, 24, 26, 0.35);
    box-shadow: 0 8px 18px -12px rgba(20, 24, 26, 0.5);
    font-size: 10.5px;
    color: #14181a;
    -webkit-app-region: no-drag;
    animation: update-notice-in 220ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  #update-notice[hidden] { display: none; }
  /* The settings panel already shows the same status and would cover the notice on a small window. */
  body:has(#settings-panel:not([hidden])) #update-notice { display: none; }
  #update-notice[data-kind="downloading"] { padding-right: 9px; }
  #update-notice[data-kind="error"] { border-color: rgba(154, 74, 63, 0.55); }
  #update-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #update-progress {
    flex: none;
    width: 46px;
    height: 4px;
    border-radius: 999px;
    background: rgba(20, 24, 26, 0.12);
    overflow: hidden;
  }
  #update-progress[hidden] { display: none; }
  #update-progress-fill {
    display: block;
    width: 100%;
    height: 100%;
    background: #2f6b4f;
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 300ms ease;
  }
  #update-percent { flex: none; color: #7a827c; font-variant-numeric: tabular-nums; }
  #update-percent[hidden] { display: none; }
  #update-action-btn, #update-dismiss-btn {
    flex: none;
    font-family: inherit;
    font-size: 10px;
    border: none;
    cursor: pointer;
    transition: background 150ms ease, opacity 150ms ease;
  }
  #update-action-btn {
    padding: 3px 8px;
    border-radius: 999px;
    background: #2f6b4f;
    color: #fff;
  }
  #update-action-btn:hover { background: #255a41; }
  #update-action-btn:focus-visible, #update-dismiss-btn:focus-visible { outline: 1.5px solid #2f6b4f; outline-offset: 1px; }
  #update-dismiss-btn {
    padding: 0 3px;
    background: transparent;
    color: #7a827c;
    font-size: 12px;
    line-height: 1;
  }
  #update-dismiss-btn:hover { color: #14181a; }
  #update-action-btn[hidden], #update-dismiss-btn[hidden] { display: none; }

  @keyframes update-notice-in {
    from { transform: translateY(6px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .update-setting { border-top: 1px solid #ddd; margin-top: 8px; padding-top: 8px; }
  .update-setting .shortcut-row { margin: 0; }
  #app-version { color: #14181a; font-variant-numeric: tabular-nums; }
  #update-check-btn:disabled { opacity: 0.45; cursor: default; }
  #update-status { margin: 5px 0 0; font-size: 9.5px; line-height: 1.4; color: #7a827c; }
  #update-status:empty { display: none; }
  #update-status.error { color: #9a4a3f; }
</style>
</head>
<body>
  <canvas id="field"></canvas>
  <div id="hud" hidden><span id="score"></span></div>
  <div id="banner" hidden></div>
  <div id="reconnect-msg" hidden>재연결 대기 중…</div>
  <div id="update-notice" role="status" hidden>
    <span id="update-text"></span>
    <span id="update-progress" hidden><span id="update-progress-fill"></span></span>
    <span id="update-percent" hidden></span>
    <button id="update-action-btn" hidden></button>
    <button id="update-dismiss-btn" title="닫기" aria-label="닫기" hidden>×</button>
  </div>

  <div id="panel" hidden>
    <h2 id="panel-title">찾는 중…</h2>
    <div id="game-tabs"></div>
    <div id="mode-choice">
      <div id="variant-choice" hidden>
        <p class="choice-label">규칙</p>
        <div id="variant-buttons" class="btn-row"></div>
      </div>
      <div class="btn-row">
        <button id="solo-btn">혼자하기</button>
        <button id="versus-btn" class="primary">같이하기</button>
      </div>
    </div>
    <div id="match-view" hidden>
      <button id="mode-back-btn">‹ 뒤로</button>
      <ul id="peer-list"></ul>
      <ul id="room-list" hidden></ul>
    </div>
    <p id="hint"></p>
  </div>

  <div id="waiting-box" hidden>
    <p><strong id="waiting-name"></strong>에게 요청을 보냈어요</p>
    <div class="btn-row">
      <button id="cancel-invite-btn" class="danger">취소</button>
    </div>
  </div>

  <div id="incoming-box" hidden>
    <p><strong id="incoming-name"></strong>이(가) 대전을 신청했어요</p>
    <div class="btn-row">
      <button id="decline-btn" class="danger">거절</button>
      <button id="accept-btn" class="primary">수락</button>
    </div>
  </div>

  <div id="lobby-box" hidden>
    <h2 id="lobby-title"></h2>
    <ul id="lobby-members"></ul>
    <div class="btn-row">
      <button id="lobby-start-btn" class="primary">시작</button>
    </div>
    <p id="lobby-wait">방장이 시작하기를 기다리는 중…</p>
    <div class="btn-row">
      <button id="lobby-leave-btn" class="danger">나가기</button>
    </div>
  </div>

  <button id="idle-icon" title="상대 찾기">
    <svg viewBox="0 0 24 24" fill="none" stroke="#14181a" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9" />
      <path d="M6 9 L14 13" />
      <path d="M8 16 L15 10" />
    </svg>
  </button>
  <span id="status-dot"></span>

  <button id="quit-btn" title="종료">
    <svg viewBox="0 0 10 10" stroke="#14181a" stroke-width="1.8" stroke-linecap="round">
      <path d="M1 1 L9 9" />
      <path d="M9 1 L1 9" />
    </svg>
  </button>

  <button id="settings-btn" title="설정">
    <svg viewBox="0 0 16 16" fill="none" stroke="#14181a" stroke-width="1.6" stroke-linecap="round">
      <path d="M2 5 H14" />
      <circle cx="6" cy="5" r="1.6" fill="#14181a" stroke="none" />
      <path d="M2 11 H14" />
      <circle cx="11" cy="11" r="1.6" fill="#14181a" stroke="none" />
    </svg>
  </button>

  <div id="settings-panel" hidden>
    <h2>닉네임</h2>
    <form id="nickname-form" class="nickname-row">
      <input id="nickname-input" type="text" maxlength="24" autocomplete="off" spellcheck="false" aria-label="닉네임">
      <button id="nickname-save-btn" type="submit">변경</button>
    </form>
    <p id="nickname-msg" role="status"></p>
    <h2>단축키</h2>
    <div class="shortcut-row">
      <span>숨기기</span>
      <button id="shortcut-hide-btn"></button>
    </div>
    <div class="shortcut-row">
      <span>보이기</span>
      <button id="shortcut-show-btn"></button>
    </div>
    <button id="settings-reset-btn">기본값으로</button>
    <p id="settings-msg"></p>
    <div class="analytics-setting">
      <label><input id="analytics-enabled" type="checkbox" disabled>게임 이용 통계 보내기</label>
      <p>기본으로 켜져 있으며 언제든 끌 수 있습니다. 게임 종류·혼자/멀티·시작 시각·앱 버전·OS와 무작위 설치 ID를 전송합니다. 닉네임과 조작 내용은 보내지 않습니다. 끄면 미전송 기록을 지웁니다.</p>
      <p id="analytics-msg" role="status"></p>
    </div>
    <div class="update-setting">
      <h2>업데이트</h2>
      <div class="shortcut-row">
        <span id="app-version"></span>
        <button id="update-check-btn">업데이트 확인</button>
      </div>
      <p id="update-status" role="status"></p>
    </div>
  </div>
