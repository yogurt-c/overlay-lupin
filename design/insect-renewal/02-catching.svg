t-size="21" fill="#293E34" font-weight="700">02 / 포획 화면</text><text x="759" y="177" font-size="16" fill="#54765B" font-weight="400">거리와 방향을 맞추는 손맛</text><text x="759" y="232" font-size="17" fill="#293E34" font-weight="600">시간 고리 대신 채의 면적</text><text x="759" y="259" font-size="13" fill="#54765B" font-weight="400">착지할 위치를 읽고 포획 영역에 넣는다.</text><text x="759" y="321" font-size="17" fill="#293E34" font-weight="600">과장된 실루엣</text><text x="759" y="348" font-size="13" fill="#54765B" font-weight="400">작은 곤충도 윤곽과 그림자로 구분한다.</text><text x="759" y="410" font-size="17" fill="#293E34" font-weight="600">놓는 순간, 휙!</text><text x="759" y="437" font-size="13" fill="#54765B" font-weight="400">짧은 선행 동작 뒤 실제 영역을 판정한다.</text><text x="759" y="499" font-size="17" fill="#293E34" font-weight="600">실패에도 다음 선택</text><text x="759" y="526" font-size="13" fill="#54765B" font-weight="400">한 번 놓치면 근처로 이동, 추적 기회.</text><text x="48" y="721" font-size="12" fill="#54765B" font-weight="400">DESIGN DRAFT 02   /   궤적 점선은 설명용 주석 · 실제 플레이에는 정답 궤적을 표시하지 않음</text></svg>