 width="20" height="24" rx="6" fill="#A56E58" stroke="none"/><ellipse cx="545" cy="329" rx="13" ry="12" fill="#E9C799" stroke="#293E34"/><ellipse cx="545" cy="322" rx="19" ry="5" fill="#E8D6A8" stroke="#293E34"/><rect x="533" y="312" width="24" height="12" rx="5" fill="#E8D6A8" stroke="none"/><path d="M 540 361 v 8 M 551 361 v 8" stroke="#293E34" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="535" y="388" font-size="12" fill="#293E34" font-weight="400">P2</text><path d="M 340 400 Q 380 380 388 338" stroke="#54765B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><rect x="59" y="128" width="255" height="38" rx="12" fill="#F6F1E5" stroke="none"/><text x="73" y="152" font-size="15" fill="#293E34" font-weight="600">花 바람꽃 초지   ·   낮</text><rect x="60" y="604" width="352" height="53" rx="12" fill="#F6F1E5" stroke="none"/><text x="76" y="627" font-size="13" fill="#293E34" font-weight="400">새로운 흔적  ·  꽃 위에서 날개가 반짝여요</text><text x="76" y="647" font-size="12" fill="#54765B" font-weight="400">WASD 이동    Space 겨누기    C 도감</text><rect x="591" y="132" width="108" height="82" rx="12" fill="#F6F1E5" stroke="none"/><path d="M 605 194 Q 632 148 684 166" stroke="#CEC3A1" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="634" cy="178" rx="4" ry="4" fill="#54765B" stroke="none"/><ellipse cx="673" cy="188" rx="4" ry="4" fill="#A56E58" stroke="none"/><text x="608" y="205" font-size="11" fill="#293E34" font-weight="400">숲 전체  M</text><text x="759" y="145" font-size="21" fill="#293E34" font-weight="700">01 / 탐험 화면</text><text x="759" y="177" font-size="16" fill="#54765B" font-weight="400">발견 → 접근 → 겨누기</text><text x="759" y="232" font-size="17" fill="#293E34" font-weight="600">낮은 탑다운 시점</text><text x="759" y="259" font-size="13" fill="#54765B" font-weight="400">나무 옆면과 바닥 동선을 함께 읽는다.</text><text x="759" y="321" font-size="17" fill="#293E34" font-weight="600">길에서 숲으로</text><text x="759" y="348" font-size="13" fill="#54765B" font-weight="400">넓은 길은 이동, 꽃밭은 채집 공간.</text><text x="759" y="410" font-size="17" fill="#293E34" font-weight="600">단서는 가까이서</text><text x="759" y="437" font-size="13" fill="#54765B" font-weight="400">미발견 곤충의 정확한 위치는 숨긴다.</text><text x="759" y="499" font-size="17" fill="#293E34" font-weight="600">개인 카메라</text><text x="759" y="526" font-size="13" fill="#54765B" font-weight="400">친구가 멀어져도 내 화면은 유지된다.</text><text x="48" y="721" font-size="12" fill="#54765B" font-weight="400">DESIGN DRAFT 01   /   제안 화면 · 실제 구현 캡처 아님 · 기본 창 640 × 480 기준</text></svg>