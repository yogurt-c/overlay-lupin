#BDCC9D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M 559 123 Q 435 221 516 351 Q 594 458 537 657" stroke="#A8C9C6" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="71" y="243" width="185" height="61" rx="12" fill="#F6F1E5" stroke="none"/><text x="83" y="268" font-size="16" fill="#293E34" font-weight="600">수액나무 숲</text><text x="83" y="289" font-size="11" fill="#54765B" font-weight="400">멈춤 · 뒤로 접근</text><rect x="340" y="203" width="204" height="61" rx="12" fill="#F6F1E5" stroke="none"/><text x="352" y="228" font-size="16" fill="#293E34" font-weight="600">물가 갈대밭</text><text x="352" y="249" font-size="11" fill="#54765B" font-weight="400">순찰 · 길목에서 기다리기</text><rect x="213" y="383" width="194" height="61" rx="12" fill="#F6F1E5" stroke="none"/><text x="225" y="408" font-size="16" fill="#293E34" font-weight="600">바람꽃 초지</text><text x="225" y="429" font-size="11" fill="#54765B" font-weight="400">비행 · 꽃에 앉는 순간</text><rect x="368" y="564" width="205" height="61" rx="12" fill="#F6F1E5" stroke="none"/><text x="380" y="589" font-size="16" fill="#293E34" font-weight="600">낙엽 정원</text><text x="380" y="610" font-size="11" fill="#54765B" font-weight="400">도약 · 착지 지점 읽기</text><rect x="70" y="573" width="171" height="61" rx="12" fill="#F6F1E5" stroke="none"/><text x="82" y="598" font-size="16" fill="#293E34" font-weight="600">작은 쉼터</text><text x="82" y="619" font-size="11" fill="#54765B" font-weight="400">시작 · 기록 · 합류</text><rect x="653" y="110" width="427" height="570" rx="24" fill="#FFFCF4" stroke="#D8CEB9"/><text x="680" y="149" font-size="23" fill="#293E34" font-weight="700">나의 관찰 노트</text><text x="680" y="176" font-size="14" fill="#54765B" font-weight="400">도감 12 / 30   ·   금색 1 / 30</text><rect x="680" y="198" width="374" height="205" rx="14" fill="#F0EBD9" stroke="none"/><g transform="translate(866 288) scale(4)"><ellipse cx="-7" cy="-4" rx="8" ry="10" fill="#E8BD53" stroke="#293E34"/><ellipse cx="7" cy="-4" rx="8" ry="10" fill="#E8BD53" stroke="#293E34"/><ellipse cx="-5" cy="7" rx="6" ry="6" fill="#E8BD53" stroke="#293E34"/><ellipse cx="5" cy="7" rx="6" ry="6" fill="#E8BD53" stroke="#293E34"/><path d="M 0 -9 V 12 M 0 -7 L -4 -14 M 0 -7 L 4 -14" stroke="#293E34" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="944" y="215" width="92" height="28" rx="12" fill="#E8D69E" stroke="none"/><text x="958" y="234" font-size="11" fill="#293E34" font-weight="400">새 크기 기록</text><text x="681" y="442" font-size="28" fill="#293E34" font-weight="700">노랑나비</text><text x="681" y="470" font-size="14" fill="#54765B" font-weight="400">일반  ·  27 mm  ·  바람꽃 초지</text><text x="681" y="508" font-size="13" fill="#293E34" font-weight="400">관찰  꽃 위에 앉으면 천천히 다가가세요.</text><text x="681" y="536" font-size="13" fill="#54765B" font-weight="400">첫 발견 / 첫 포획 / 크기 기록</text><rect x="680" y="570" width="177" height="43" rx="12" fill="#54765B" stroke="none"/><text x="706" y="597" font-size="13" fill="#FFFFFF" font-weight="600">이번 탐험 대표 곤충</text><rect x="869" y="570" width="184" height="43" rx="12" fill="#EFE7D4" stroke="none"/><text x="903" y="597" font-size="13" fill="#293E34" font-weight="400">친구에게 자랑</text><text x="680" y="648" font-size="13" fill="#54765B" font-weight="400">경쟁 순위 없이, 오늘의 발견을 나란히.</text><text x="48" y="721" font-size="12" fill="#54765B" font-weight="400">DESIGN DRAFT 03   /   전체 지도와 수집 상세를 나란히 설명한 보드 · 실제 게임에서는 각각 열기</text></svg>