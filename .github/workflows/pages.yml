name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/renderer/**"
      - "src/shared/**"
      - "tests/web-trial.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site only needs esbuild/tsc — skip the ~100MB Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check and verify the trial games
        run: npm run build && node --test tests/web-trial.test.mjs
      - run: npm run build:web
      - name: Assemble site (docs/ without the internal markdown docs)
        run: rsync -a --exclude '*.md' docs/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
