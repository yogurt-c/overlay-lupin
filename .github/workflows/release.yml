name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "릴리즈 태그 (수동 테스트용, 예: v0.0.0-ci-test)"
        required: false
        default: "v0.0.0-ci-test"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Import Developer ID certificate into keychain
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}
      - name: Build & sign & notarize (mac universal)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run release:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build (windows)
        # SignPath 인증서가 발급되면 여기에 서명 스텝을 추가할 것
        # (signpath/github-action-submit-signing-request 사용, 빌드 아티팩트를 서명 요청으로 제출)
        run: npm run release:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s build/release-notes.md
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
            grep -Fx "## $RELEASE_TAG 변경 사항" build/release-notes.md
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Normalize updater artifact names
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # electron-builder currently emits dot-separated names, while its
          # latest*.yml metadata uses hyphen-separated URLs. Keep both in sync
          # so electron-updater can download the published assets.
          mv "release/Overlay.Lupin-${version}-universal-mac.zip" \
             "release/Overlay-Lupin-${version}-universal-mac.zip"
          mv "release/Overlay.Lupin-${version}-universal-mac.zip.blockmap" \
             "release/Overlay-Lupin-${version}-universal-mac.zip.blockmap"
          mv "release/Overlay.Lupin-${version}-universal.dmg" \
             "release/Overlay-Lupin-${version}-universal.dmg"
          mv "release/Overlay.Lupin-${version}-universal.dmg.blockmap" \
             "release/Overlay-Lupin-${version}-universal.dmg.blockmap"
          mv "release/Overlay.Lupin.Setup.${version}.exe" \
             "release/Overlay-Lupin-Setup-${version}.exe"
          mv "release/Overlay.Lupin.Setup.${version}.exe.blockmap" \
             "release/Overlay-Lupin-Setup-${version}.exe.blockmap"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Overlay Lupin ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: build/release-notes.md
          # Upload every asset before exposing the release to automatic updates.
          draft: true
          fail_on_unmatched_files: true
          files: release/*
      - name: Publish tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
